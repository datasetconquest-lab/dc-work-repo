<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Data Conquest</title>
  <meta property="og:title" content="Data Conquest" />
  <meta property="og:image" content="/logo_light.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/logo_light.png" />
  <script>
    // Apply the saved/OS theme before paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = t;
      } catch (e) { /* no-op */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
